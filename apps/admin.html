.grid{display:grid;gap:16px}
.kpi-grid{grid-template-columns:repeat(4,1fr)}

.kpi-foot{font-size:11.5px;color:var(--muted);margin-top:7px;display:flex;align-items:center;gap:5px}
.trend-up{color:var(--green);font-weight:600}
.trend-flat{color:var(--muted);font-weight:600}

.card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.card-title{font-size:13.5px;font-weight:700}
.card-sub{font-size:11.5px;color:var(--muted);margin-top:2px}

/* ===== Score / bars ===== */
.score{font-weight:700;letter-spacing:-.3px}
.s-green{color:var(--green)} .s-blue{color:var(--blue)} .s-orange{color:#d97706} .s-red{color:var(--red)} .s-gray{color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:#f2f3f6;color:#5b616b}
.bar{height:6px;border-radius:4px;background:#eef0f3;overflow:hidden}

.bar-row{display:flex;align-items:center;gap:10px}
.bar-row .bar{flex:1}

/* ===== Table ===== */
.table-wrap{overflow-x:auto}

.row-actions{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:12.5px;cursor:pointer;color:var(--ink-2);transition:.15s}
.btn:hover{border-color:#cfd3da;color:var(--ink);background:#fafbfc}
.btn-primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-primary:hover{background:#232842;border-color:#232842;color:#fff}
.btn-sm{padding:4px 9px;font-size:11.5px;border-radius:7px}

.link:hover{text-decoration:underline}

.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding:24px 26px}

.metric-row+.metric-row{border-top:1px dashed var(--line-2)}
.metric-row .v{font-weight:600}

/* ===== Transcript ===== */
.round{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow)}
.round.key{border-color:#f3c98b;box-shadow:0 0 0 3px rgba(245,158,11,.10),var(--shadow)}
.round-hd{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fafbfc;border-bottom:1px solid var(--line-2);font-size:11.5px;color:var(--muted)}

.round-no{font-weight:700;color:var(--ink-2);font-size:12px}
.round-score{margin-left:auto;font-weight:700;font-size:13px}
.bubble-wrap{padding:16px 18px;display:flex;flex-direction:column;gap:12px}

.eval-toggle:hover{background:#f2f3f6;color:var(--ink)}

/* ===== Chips / tags ===== */
.tag{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:5px;background:#f2f3f6;color:#5b616b;margin:0 4px 4px 0}

/* ===== Persona cards ===== */
.persona-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.persona-card{padding:22px;cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;height:100%}

.pc-top{display:flex;gap:14px;align-items:center}

.pc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:1px solid var(--line-2);font-size:11.5px;color:var(--muted)}
.pc-metrics{display:flex;gap:14px}
.pc-metrics b{color:var(--ink);font-size:13px;font-weight:700}

/* ===== Config page ===== */
.tabs{display:flex;gap:4px;padding:6px;background:#f2f3f6;border-radius:10px;width:max-content;margin-bottom:18px}
.tabs button{border:none;background:none;padding:7px 14px;border-radius:7px;font-size:12.5px;color:var(--muted);cursor:pointer}
.tabs button.active{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(20,22,28,.08)}
.tabpane{display:none}
.tabpane.active{display:block;animation:fade .2s ease}
.q-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.q-card{padding:18px 20px}
.q-hd{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.q-id{font-size:11px;font-weight:700;color:#fff;background:var(--navy);border-radius:5px;padding:1px 6px;font-family:var(--mono)}
.q-name{font-size:13.5px;font-weight:700}
.q-text{font-size:12.5px;color:var(--ink-2);line-height:1.7}
.m-row{cursor:pointer}
.m-row td{padding-top:12px;padding-bottom:12px}
.m-detail td{background:#fafbfc;padding:0 16px 16px;border-bottom:1px solid var(--line-2)}
.m-detail .inner{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;font-size:12px;color:var(--ink-2)}
.m-detail b{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.4px;margin-bottom:3px;font-weight:700}
.chev{display:inline-block;transition:transform .15s;color:var(--muted);font-size:11px}
.m-row.open .chev{transform:rotate(90deg)}
.layer-list{display:flex;flex-direction:column;gap:0}
.layer{display:grid;grid-template-columns:34px 120px 1fr;gap:14px;padding:15px 4px;border-bottom:1px solid var(--line-2);align-items:baseline}
.layer:last-child{border-bottom:none}
.layer-no{font-family:var(--mono);font-size:11px;color:var(--muted)}
.layer-name{font-size:13.5px;font-weight:700}
.layer-q{font-size:12.5px;color:var(--ink-2)}
.pressure-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.pressure{padding:18px}
.p-name{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.p-example{font-size:12.5px;color:var(--ink);margin-top:9px;line-height:1.7;font-style:italic}
.p-rule{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.65}
.case-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.case-card{padding:18px 20px}
.case-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.case-id{font-family:var(--mono);font-size:11px;color:var(--muted)}
.case-q{font-size:12.5px;color:var(--blue);margin-top:10px;line-height:1.65;font-weight:500}
.case-bound{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.6;padding-top:10px;border-top:1px dashed var(--line-2)}

/* ===== Observer ===== */
.flow{display:grid;grid-template-columns:1fr 44px 1fr;align-items:center;gap:0;padding:22px}
.flow-box{border:1px solid var(--line);border-radius:12px;padding:18px}
.flow-box.hint{border-color:#bfd3f6;background:#f7faff}
.flow-box.eval{border-color:#cfc3f2;background:#fbf9ff}
.flow-arrow{text-align:center;color:var(--muted);font-size:18px}
.flow-title{font-size:13px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:7px}
.flow-desc{font-size:12px;color:var(--ink-2);line-height:1.7}
.flow-desc code{font-family:var(--mono);font-size:11px;background:#fff;border:1px solid var(--line);padding:1px 5px;border-radius:4px}
.risk{display:flex;gap:10px;align-items:flex-start;background:#fffaf0;border:1px solid #f5e0b7;border-radius:10px;padding:12px 14px;font-size:12px;color:#8a5a11;line-height:1.65;margin-top:14px}
.mode-card{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border:1px solid var(--line);border-radius:11px;background:#fff}
.mode-card+.mode-card{margin-top:10px}
.mode-card.on{border-color:#cfd8ea;background:#fafbff}
.mode-name{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.mode-desc{font-size:12px;color:var(--ink-2);line-height:1.65;margin-top:4px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dim-row td{padding:12px 16px}
.dim-name{font-weight:600;font-size:13px}
.dim-desc{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.6;max-width:560px}
.boundary th,.boundary td{border-bottom:1px solid var(--line-2);padding:11px 16px;font-size:12.5px}
.boundary thead th{background:#fafbfc}
.can{color:#0b7a45} .cannot{color:#b91c1c}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:13px}
.note{font-size:11.5px;color:var(--muted);line-height:1.8;margin-top:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:12.5px}
.kv dt{color:var(--muted)}
.kv dd{color:var(--ink-2)}

<script>
/* ===================== Data & helpers ===================== */
const DATA = JSON.parse(document.getElementById('app-data').textContent);
const state = { view: 'overview', q: '', mode: 'all', sort: 'time', recordId: null, personaId: null };
const el = id => document.getElementById(id);

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pct = v => v == null ? '—' : Math.round(v * 100) + '%';
const fmtDT = iso => {
  if (!iso) return '—';
  const d = new Date(iso);
  const p = n => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};
const fmtFull = iso => {
  if (!iso) return '—';
  const d = new Date(iso);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};
const scoreClass = v => v == null ? 's-gray' : v >= 4.5 ? 's-green' : v >= 4 ? 's-blue' : v >= 3.5 ? 's-orange' : 's-red';
const barClass = v => v == null ? '' : v >= 4.5 ? 'g' : v >= 4 ? '' : v >= 3.5 ? 'o' : 'r';
const modeChip = m => m === 'assisted'
  ? '<span class="chip purple">assisted · 观察者介入</span>'
  : '<span class="chip gray">baseline · 基线</span>';
const personaOf = id => DATA.personas.find(p => p.id === id) || { name: '—', avatar: '?' };
const metaOf = id => DATA.interviewer.method_patterns.find(m => m.id === id);

function stats() {
  const iv = DATA.interviews;
  const avg = iv.reduce((s, i) => s + (i.weightedTotal || 0), 0) / iv.length;
  const hits = iv.reduce((s, i) => s + (i.recall ? i.recall.hit : 0), 0);
  const total = iv.reduce((s, i) => s + (i.recall ? i.recall.total : 0), 0);
  const rounds = iv.reduce((s, i) => s + i.roundCount, 0);
  const assisted = iv.filter(i => i.mode === 'assisted');
  const baseline = iv.filter(i => i.mode === 'baseline');
  const avgOf = list => list.length ? list.reduce((s, i) => s + i.weightedTotal, 0) / list.length : null;
  const recallOf = list => {
    const h = list.reduce((s, i) => s + i.recall.hit, 0), t = list.reduce((s, i) => s + i.recall.total, 0);
    return t ? h / t : null;
  };
  return {
    count: iv.length, rounds, avg, hits, total, rate: total ? hits / total : null,
    assistedAvg: avgOf(assisted), baselineAvg: avgOf(baseline),
    assistedRate: recallOf(assisted), baselineRate: recallOf(baseline)
  };
}

/* ===================== Charts ===================== */
function lineChart(rec) {
  const rs = rec.rounds, W = 660, H = 236, P = { l: 30, r: 18, t: 22, b: 30 };
  const x = i => P.l + i * (W - P.l - P.r) / (rs.length - 1);
  const y = v => P.t + (1 - v / 5) * (H - P.t - P.b);
  const pts = rs.map((r, i) => [x(i), y(r.score == null ? 0 : r.score), r.score]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = line + ` L${x(rs.length - 1).toFixed(1)} ${H - P.b} L${P.l} ${H - P.b} Z`;
  const rows = [5, 4, 3, 2, 1].map(v => `
    <g>
      <line x1="${P.l}" y1="${y(v)}" x2="${W - P.r}" y2="${y(v)}" stroke="#eef0f3" stroke-width="1"/>
      <text x="${P.l - 8}" y="${y(v) + 3.5}" text-anchor="end" font-size="9.5" fill="#a3a9b3">${v}</text>
    </g>`).join('');
  const dots = pts.map((p, i) => {
    const isKey = rec.id.indexOf('final8') > -1 && i === 6;
    const s = p[2];
    return `<g>
      <circle cx="${p[0]}" cy="${p[1]}" r="${isKey ? 6.5 : 4.5}" fill="${isKey ? '#f59e0b' : '#2563eb'}" stroke="#fff" stroke-width="2"/>
      ${s != null ? `<text x="${p[0]}" y="${p[1] - 12}" text-anchor="middle" font-size="10" font-weight="600" fill="${isKey ? '#b45309' : '#2563eb'}">${s.toFixed(2)}</text>` : ''}
      ${isKey ? `<text x="${p[0]}" y="${p[1] + 22}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b45309">关键转折</text>` : ''}
    </g>`;
  }).join('');
  const labels = rs.map((r, i) => `<text x="${x(i)}" y="${H - P.b + 18}" text-anchor="middle" font-size="9.5" fill="#868d98">R${r.index}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">
    <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb" stop-opacity=".16"/><stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient></defs>
    ${rows}${labels}
    <path d="${area}" fill="url(#g1)"/>
    <path d="${line}" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round"/>
    ${dots}
  </svg>`;
}

function compareBars() {
  const s = stats();
  const rows = [
    { name: '辅助模式', mode: 'assisted', score: s.assistedAvg, rate: s.assistedRate, color: '#7c3aed' },
    { name: '基线模式', mode: 'baseline', score: s.baselineAvg, rate: s.baselineRate, color: '#868d98' }
  ];
  return rows.map(r => `
    <div style="padding:14px 0;border-bottom:1px dashed var(--line-2)">
      <div style="display:flex;align-items:center;justify-content:space-between;font-size:12.5px;margin-bottom:9px">
        <span style="font-weight:600">${r.name}</span>
        <span class="score ${scoreClass(r.score)}" style="font-size:15px">${r.score.toFixed(2)}</span>
      </div>
      <div class="bar-row" style="margin-bottom:8px">
        <div class="bar"><i style="width:${(r.score / 5) * 100}%;background:${r.color}"></i></div>
        <span class="mono" style="width:44px;text-align:right;color:var(--muted)">${pct(r.rate)} 召回</span>
      </div>
      <div class="muted" style="font-size:11px">${r.mode === 'assisted' ? '观察者 hint 回流，衡量辅助后的结果' : '观察者不介入，衡量采访者原始水平'}</div>
    </div>`).join('');
}

/* ===================== Overview ===================== */
function renderOverview() {
  const s = stats();
  const rec = DATA.interviews.find(i => i.id.indexOf('final8') > -1);
  const recent = DATA.interviews.slice().sort((a, b) => new Date(b.endedAt) - new Date(a.endedAt));
  el('view-overview').innerHTML = `
    <div class="page-head">
      <div>
        <div class="page-title">概览</div>
        <div class="page-desc">${DATA.interviews.length} 场实测访谈、${DATA.personas.length} 位人物与两套 Agent 配置的只读视图。评分以 round 为单位，召回率由脚本事后统计。</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <span class="chip green"><span class="chip-dot"></span>隔离校验通过</span>
        <span class="chip">停止原因：max-rounds</span>
      </div>
    </div>

    <div class="grid kpi-grid">
      <div class="card kpi">
        <div class="kpi-label">访谈场次</div>
        <div class="kpi-value">${s.count}<small>场 / ${s.rounds} 轮</small></div>
        <div class="kpi-foot"><span class="trend-flat">assisted ${DATA.interviews.filter(i => i.mode === 'assisted').length} · baseline ${DATA.interviews.filter(i => i.mode === 'baseline').length}</span></div>
      </div>
      <div class="card kpi">
        <div class="kpi-label">平均加权得分</div>
        <div class="kpi-value ${scoreClass(s.avg)}">${s.avg.toFixed(2)}<small>/ 5.00</small></div>
        <div class="kpi-foot"><span class="trend-flat">assisted ${s.assistedAvg.toFixed(2)} · baseline ${s.baselineAvg.toFixed(2)}</span></div>
      </div>
      <div class="card kpi">
        <div class="kpi-label">平均埋点召回率</div>
        <div class="kpi-value ${s.rate >= .4 ? 's-blue' : 's-orange'}">${pct(s.rate)}</div>
        <div class="kpi-foot">命中 ${s.hits} / ${s.total} 条埋点</div>
      </div>
      <div class="card kpi">
        <div class="kpi-label">人物库</div>
        <div class="kpi-value">${DATA.personas.length}<small>位</small></div>
        <div class="kpi-foot">语料文件 11 · 人物卡埋点 10</div>
      </div>
    </div>

    <div class="grid chart-grid" style="margin-top:16px">
      <div class="card">
        <div class="card-head">
          <div>
            <div class="card-title">单场得分走势 · ${esc(rec.title)}</div>
            <div class="card-sub">按 round 的观察者加权分，R7 为全场关键转折</div>
          </div>
          <span class="chip gray">${rec.roundCount} 轮 · 加权 ${rec.weightedTotal}</span>
        </div>
        <div style="padding:10px 12px 4px">${lineChart(rec)}</div>
      </div>
      <div class="card">
        <div class="card-head">
          <div>
            <div class="card-title">模式对照</div>
            <div class="card-sub">同一人物卡下的辅助场与基线场</div>
          </div>
        </div>
        <div style="padding:4px 20px 16px">${compareBars()}</div>
        <div style="padding:0 20px 18px">
          <div class="risk" style="margin-top:0">
            <span>带介入的分数衡量辅助后的结果，不能当作该采访者的真实水平；与基线场比较时才看提升幅度。
            </span>
          </div>
        </div>
      </div>
    </div>

    <div class="section-title">最近访谈 <span class="sub">共 ${recent.length} 场，点击行查看全文</span></div>
    <div class="card">${recordTable(recent, false)}</div>
  `;
  bindRecordRows();
}

/* ===================== Table ===================== */
function recordTable(list, actions = true) {
  if (!list.length) return '<div class="empty">没有符合条件的访谈</div>';
  const rows = list.map(r => `
    <tr class="clickable" data-rec="${esc(r.id)}">
      <td>
        <div class="cell-title">${esc(r.title)}</div>
        <div class="cell-sub">${esc(r.id)}</div>
      </td>
      <td>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="avatar-mini" style="width:24px;height:24px;font-size:10px">${esc(personaOf(r.personaId).avatar)}</div>
          <span>${esc(r.personaName)}</span>
        </div>
      </td>
      <td>${modeChip(r.mode)}</td>
      <td><span class="mono">${r.roundCount}</span> 轮</td>
      <td><span class="score ${scoreClass(r.weightedTotal)}" style="font-size:15px">${r.weightedTotal.toFixed(2)}</span></td>
      <td>${pct(r.coverage)}</td>
      <td><span class="score ${r.recall.rate >= .4 ? 's-blue' : 's-orange'}" style="font-size:13px">${pct(r.recall.rate)}</span> <span class="muted" style="font-size:11px">(${r.recall.hit}/${r.recall.total})</span></td>
      <td class="muted" style="white-space:nowrap">${fmtDT(r.endedAt)}</td>
      ${actions ? '<td><span class="link">查看 →</span></td>' : ''}
    </tr>`).join('');
  return `<div class="table-wrap"><table>
    <thead><tr><th>访谈</th><th>人物</th><th>模式</th><th>轮次</th><th>加权得分</th><th>覆盖率</th><th>埋点召回</th><th>结束时间</th>${actions ? '<th></th>' : ''}</tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function bindRecordRows() {
  document.querySelectorAll('tr[data-rec]').forEach(tr => {
    tr.onclick = () => { state.recordId = tr.dataset.rec; state.view = 'records'; setView('records'); };
  });
}
/* ===================== Records ===================== */
function filteredRecords() {
  let list = DATA.interviews.slice();
  if (state.mode !== 'all') list = list.filter(r => r.mode === state.mode);
  if (state.q.trim()) {
    const q = state.q.trim().toLowerCase();
    list = list.filter(r => (r.title + r.id + r.personaName).toLowerCase().indexOf(q) > -1);
  }
  if (state.sort === 'score') list.sort((a, b) => b.weightedTotal - a.weightedTotal);
  else if (state.sort === 'recall') list.sort((a, b) => b.recall.rate - a.recall.rate);
  else list.sort((a, b) => new Date(b.endedAt) - new Date(a.endedAt));
  return list;
}

function renderRecords() {
  const view = el('view-records');
  if (state.recordId) {
    const rec = DATA.interviews.find(r => r.id === state.recordId);
    if (rec) { view.innerHTML = recordDetail(rec); bindDetail(rec); return; }
  }
  const list = filteredRecords();
  view.innerHTML = `
    <div class="page-head">
      <div>
        <div class="page-title">访谈记录</div>
        <div class="page-desc">来自 <span class="mono">apps/workbench/records/</span> 的实测记录。一轮 round 含 1–N 条发言，评分以 round 为单位。</div>
      </div>
    </div>
    <div class="card">
      <div class="toolbar">
        <div class="search">
          <svg width="14" height="14" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" stroke="#868d98" fill="none" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="#868d98" stroke-width="2"/></svg>
          <input id="rec-q" placeholder="搜索访谈标题、人物或 ID" value="${esc(state.q)}">
        </div>
        <div class="seg" id="rec-mode">
          <button data-mode="all" class="${state.mode === 'all' ? 'active' : ''}">全部</button>
          <button data-mode="assisted" class="${state.mode === 'assisted' ? 'active' : ''}">assisted</button>
          <button data-mode="baseline" class="${state.mode === 'baseline' ? 'active' : ''}">baseline</button>
        </div>
        <select id="rec-sort">
          <option value="time" ${state.sort === 'time' ? 'selected' : ''}>按结束时间</option>
          <option value="score" ${state.sort === 'score' ? 'selected' : ''}>按加权得分</option>
          <option value="recall" ${state.sort === 'recall' ? 'selected' : ''}>按埋点召回</option>
        </select>
        <span class="toolbar-count">${list.length} / ${DATA.interviews.length} 场</span>
      </div>
      ${recordTable(list)}
    </div>
    <div class="note">字段说明：加权得分来自观察者 finalEval；覆盖率 = 该项目被评分的维度占比，未评分维度（缺少时间戳等）不计入；埋点召回由脚本按人物卡关键词事后统计，观察者与采访者都看不到埋点内容。</div>
  `;
  const input = el('rec-q');
  input.oninput = e => { state.q = e.target.value; renderRecords(); el('rec-q').focus(); el('rec-q').setSelectionRange(state.q.length, state.q.length); };
  el('rec-mode').querySelectorAll('button').forEach(b => b.onclick = () => { state.mode = b.dataset.mode; renderRecords(); });
  el('rec-sort').onchange = e => { state.sort = e.target.value; renderRecords(); };
  bindRecordRows();
}

function evalItemHtml(item, dims) {
  const d = dims.find(x => x.id === item.id) || { name: item.id };
  const s = item.score;
  return `<div class="eval-item">
    <div class="eval-item-hd">
      <span>${esc(d.name)}</span>
      ${s == null ? '<span class="pill" style="color:#b45309;background:#fef4e3">无法判断</span>' : `<span class="score ${scoreClass(s)}" style="font-size:12.5px">${s} / 5</span>`}
    </div>
    <div class="eval-reason">${esc(item.reason)}</div>
    ${item.quote ? `<div class="eval-quote">「${esc(item.quote)}」</div>` : ''}
    ${item.note ? `<div class="eval-quote">注：${esc(item.note)}</div>` : ''}
  </div>`;
}

    <div class="detail-grid">

        ${roundsHtml}
      </div>
      <div class="side-stack">
        <div class="card mini-card">

          <div class="metric-row"><span class="muted">覆盖率</span><span class="v">${pct(rec.coverage)}</span></div>
          <div class="metric-row"><span class="muted">埋点召回</span><span class="v">${pct(rec.recall.rate)} <span class="muted" style="font-weight:400">(${rec.recall.hit}/${rec.recall.total})</span></span></div>
          <div class="metric-row"><span class="muted">模式</span><span class="v">${rec.mode === 'assisted' ? '辅助介入' : '基线'}</span></div>
          <div class="metric-row"><span class="muted">停止原因</span><span class="v">${esc(rec.stopReason)}</span></div>

function personaDetail(p) {
  const linked = DATA.interviews.filter(i => i.personaId === p.id);
  const sections = p.sections.map(s => {
    if (s.kind === 'list') {
      return `<div class="card card-pad" style="margin-bottom:14px">
        <div class="card-title" style="margin-bottom:10px">${esc(s.title)}</div>
        <ul style="padding-left:18px;font-size:12.5px;color:var(--ink-2);line-height:1.9">${s.items.map(x => `<li>${esc(x)}</li>`).join('')}</ul>

    }
    if (s.kind === 'text') {
      return `<div class="card card-pad" style="margin-bottom:14px">
        <div class="card-title" style="margin-bottom:10px">${esc(s.title)}</div>
        <div style="font-size:12.5px;color:var(--ink-2);line-height:1.8">${esc(s.text)}</div>
      </div>`;
    }
    if (s.kind === 'planted') {
      return `<div class="card" style="margin-bottom:14px">
        <div class="card-head"><div><div class="card-title">${esc(s.title)}</div><div class="card-sub">${esc(s.note)}</div></div><span class="chip orange">${s.items.length} 条</span></div>
        <div style="padding:6px 20px 16px">
          ${s.items.map((x, i) => `<div style="display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2)">

              <div style="font-size:12.5px;line-height:1.6">${esc(x.text)}</div>
              <div style="margin-top:5px"><span class="chip gray" style="font-size:10px;padding:1px 7px">kw</span> <span class="mono" style="color:var(--muted);font-size:10.5px">${esc(x.kw)}</span></div>
            </div>
          </div>`).join('')}
        </div>
      </div>`;
    }
    if (s.kind === 'evidence') {
      return `<div class="section-title">${esc(s.title)} <span class="sub">${s.items.length} 条</span></div>
        ${s.items.map(e => `<div class="card card-pad" style="margin-bottom:12px">
          <div style="display:flex;align-items:center;gap:9px;margin-bottom:7px">
            <span class="q-id">${esc(e.id)}</span>
            <span style="font-size:13.5px;font-weight:700">${esc(e.title)}</span>
          </div>
          <div style="font-size:12.5px;color:var(--ink-2);line-height:1.8">${esc(e.content)}</div>
          <div style="margin-top:9px">${(e.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}${e.source ? `<span class="muted" style="font-size:11px">出处：${esc(e.source)}</span>` : ''}</div>
        </div>`).join('')}`;
    }
    if (s.kind === 'corpus') {
      return `<div class="card" style="margin-bottom:14px">
        <div class="card-head"><div><div class="card-title">${esc(s.title)}</div><div class="card-sub">按需检索，模型带工具多轮回忆原文</div></div><span class="chip">${s.items.length} 个文件</span></div>
        <div class="table-wrap"><table>
          <thead><tr><th>ID</th><th>类型</th><th>条目</th><th>来源</th><th>文件</th></tr></thead>
          <tbody>${s.items.map(e => `<tr>
            <td class="mono">${esc(e.id)}</td>
            <td><span class="pill">${esc(e.type)}</span></td>
            <td style="font-weight:600">${esc(e.title)}</td>

        </table></div>
      </div>`;

  return `

      <div style="display:flex;gap:16px;align-items:flex-start">

        </div>
      </div>
      <div style="flex:0 0 236px">
        <div class="mini-title" style="margin-bottom:10px">档案</div>
        <div class="kv">${p.meta.map(m => `<dt>${esc(m[0])}</dt><dd>${esc(m[1])}</dd>`).join('')}</div>

          </div>`).join('') : '<div class="muted" style="font-size:12px">尚未关联实测访谈</div>'}
        </div>
        <div class="card mini-card">
          <div class="mini-title">信息边界</div>
          <div class="note" style="margin-top:0">采访者拿不到人物卡，观察者拿不到人物卡（连埋点也看不到）。本页是后台视图，因此能同时看到人物卡与埋点；这一权限不回流给任何 Agent。</div>

      <div class="card card-pad">
        <div class="mini-title">修改边界</div>
        <div class="note" style="margin-top:0">只改组装层 <span class="mono">packages/bundle/&lt;profile&gt;/cordis.patch.yml</span> 的 personaPrefix、策略插件与评分插件；不改上游 core。采访者的输入中绝不允许出现人物卡任何内容。</div>
      </div>
    </div>

    <div class="tabs" id="iv-tabs">
      <button class="active" data-tab="q">质量标准 · 10</button>
      <button data-tab="m">方法模式 · 15</button>
      <button data-tab="p">压力测试 · 6</button>
      <button data-tab="c">案例卡 · 4</button>
      <button data-tab="l">规则八层</button>
      <button data-tab="w">口语替换 · 9</button>
    </div>

    <div class="tabpane active" id="iv-q">
      <div class="grid q-grid">
        ${I.quality_standards.map(q => `<div class="card q-card">
          <div class="q-hd"><span class="q-id">${esc(q.id)}</span><span class="q-name">${esc(q.name)}</span></div>
          <div class="q-text">${esc(q.criterion)}</div>
        </div>`).join('')}
      </div>
    </div>

    <div class="tabpane" id="iv-m">
      <div class="card"><div class="table-wrap"><table>
        <thead><tr><th style="width:34px"></th><th style="width:52px">ID</th><th>名称</th><th style="width:34%">信号</th><th style="width:140px">状态</th></tr></thead>
        <tbody>
          ${I.method_patterns.map(m => `<tr class="m-row" data-m="${esc(m.id)}">
            <td><span class="chev">›</span></td>
            <td class="mono">${esc(m.id)}</td>
            <td style="font-weight:600">${esc(m.name)}</td>
            <td class="muted" style="font-size:12px">${esc(m.signal)}</td>
            <td><span class="pill" style="font-size:10.5px">${esc(m.status.split('；')[0])}</span></td>
          </tr>
          <tr class="m-detail" id="md-${esc(m.id)}" style="display:none">
            <td></td><td></td>
            <td colspan="3"><div class="inner">
              <div><b>动作</b>${esc(m.move)}</div>
              <div><b>代价</b>${esc(m.cost)}</div>
              <div><b>失败方式</b>${esc(m.failure)}</div>
            </div>
            <div class="muted" style="font-size:11px;margin-top:10px">来源：${m.source_ids.length ? m.source_ids.map(s => `<span class="tag">${esc(s)}</span>`).join('') : '项目内推演'} · ${esc(m.status)}</div></td>
          </tr>`).join('')}
        </tbody>
      </table></div></div>
    </div>

    <div class="tabpane" id="iv-p">
      <div class="grid pressure-grid">
        ${I.pressure_tests.map((p, i) => `<div class="card pressure">
          <div class="p-name"><span class="q-id">0${i + 1}</span>${esc(p.name)}</div>
          <div class="p-example">「${esc(p.example)}」</div>
          <div class="p-rule">${esc(p.rule)}</div>
        </div>`).join('')}
      </div>
    </div>

    <div class="tabpane" id="iv-c">
      <div class="grid case-grid">
        ${I.checked_case_cards.map(c => `<div class="card case-card">
          <div class="case-hd"><span style="font-size:13px;font-weight:700">${esc(c.id)}</span><span class="case-id">${esc(c.source_id)} · ${esc(c.locator)}</span></div>
          <div style="font-size:12.5px;color:var(--ink-2);line-height:1.7">${esc(c.fact)}</div>
          <div class="case-q">${esc(c.question)}</div>
          <div class="case-bound">边界：${esc(c.boundary)}</div>
        </div>`).join('')}
      </div>
    </div>

    <div class="tabpane" id="iv-l">
      <div class="card card-pad">
        <div class="layer-list">
          ${I.rule_layers.map((l, i) => `<div class="layer">
            <span class="layer-no">0${i + 1}</span>
            <span class="layer-name">${esc(l.name)}</span>
            <span class="layer-q">${esc(l.question)}</span>
          </div>`).join('')}
        </div>
        <div class="note">参数不硬填：金额、比例、时长、人数可以留空，但不能用「参数未定」回避权利选择。</div>
      </div>
    </div>

    <div class="tabpane" id="iv-w">
      <div class="grid two-grid" style="align-items:start">
        <div class="card"><div class="card-head"><div class="card-title">书面词 → 口语说法</div><div class="card-sub">访谈中不念术语</div></div>
          <div class="table-wrap"><table>
            <thead><tr><th>书面词</th><th>口语替换</th></tr></thead>
            <tbody>${I.word_choices.map(w => `<tr><td style="color:var(--muted)">${esc(w.written)}</td><td style="font-weight:600">${esc(w.spoken)}</td></tr>`).join('')}</tbody>
          </table></div>
        </div>
        <div class="card card-pad">
          <div class="card-title" style="margin-bottom:10px">口语原则</div>
          <ul style="padding-left:18px;font-size:12.5px;color:var(--ink-2);line-height:1.85">${I.oral_principles.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
        </div>
      </div>
    </div>
  `;
  el('iv-tabs').querySelectorAll('button').forEach(b => b.onclick = () => {
    el('iv-tabs').querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
    ['q', 'm', 'p', 'c', 'l', 'w'].forEach(k => el('iv-' + k).classList.toggle('active', k === b.dataset.tab));
  });
  document.querySelectorAll('.m-row').forEach(r => r.onclick = () => {
    const d = el('md-' + r.dataset.m);
    const open = d.style.display !== 'none';
    d.style.display = open ? 'none' : 'table-row';
    r.classList.toggle('open', !open);
  });
}

/* ===================== Observer ===================== */
function renderObserver() {
  const O = DATA.observer;
  const rec = DATA.interviews.find(i => i.id.indexOf('final8') > -1);
  el('view-observer').innerHTML = `
    <div class="page-head">
      <div>
        <div class="page-title">观察者设置</div>
        <div class="page-desc">评估提问质量，并比对访谈总结与人物卡的一致性。输出必须拆成两份：hint 回流、eval 不回流。</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <span class="chip purple">观察者看不到人物卡</span>
        <span class="chip green">隔离校验通过</span>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <div><div class="card-title">输出分层</div><div class="card-sub">混在一起会毁掉分数的可比性</div></div>
        <span class="chip gray">实时模式</span>
      </div>
      <div class="flow">
        <div class="flow-box hint">
          <div class="flow-title" style="color:#1d4ed8">hint · 回流给采访者</div>
          <div class="flow-desc">只给问题类型与追问方向，例如「受访者停在结论了，往下追一次他当时的判断依据」。<br><br><strong>不给原句改写</strong>，让采访者自己组织语言。</div>
        </div>
        <div class="flow-arrow">⟶</div>
        <div class="flow-box eval">
          <div class="flow-title" style="color:#6d28d9">eval · 只进记录，不回流</div>
          <div class="flow-desc">完整评分、理由、引用与改写建议，供事后复盘与横向比较。采访者与受访者在访谈过程中都看不到。</div>
        </div>
      </div>
      <div style="padding:0 22px 18px">
        <div class="risk" style="margin-top:0">落盘时记录 <code class="mono">mode: "assisted" | "baseline"</code>，说明这一场有没有被观察者介入。带介入的分数衡量的是辅助后的结果，不能当作该采访者的真实水平。</div>
      </div>
    </div>

    <div class="grid two-grid" style="margin-top:16px;align-items:start">
      <div class="card card-pad">
        <div class="mini-title">模式</div>
        ${O.modes.map((m, i) => `<div class="mode-card ${i === 0 ? 'on' : ''}">
          <span class="dot" style="background:${i === 0 ? '#7c3aed' : '#868d98'};margin-top:7px"></span>
          <div>
            <div class="mode-name">${esc(m.name)} <span class="pill mono" style="font-size:10px">${esc(m.id)}</span></div>
            <div class="mode-desc">${esc(m.desc)}</div>
          </div>
        </div>`).join('')}
      </div>
      <div class="card card-pad">
        <div class="mini-title">评分维度</div>
        <div class="table-wrap"><table>
          <thead><tr><th>维度</th><th style="width:78px">最新一场</th></tr></thead>
          <tbody>${O.dimensions.map(d => {
            const it = (rec.finalItems || []).find(x => x.id === d.id);
            const s = it ? it.score : null;
            return `<tr><td><div class="dim-name">${esc(d.name)}</div><div class="dim-desc">${esc(d.desc)}</div></td>
              <td>${s == null ? '<span class="pill" style="color:#b45309;background:#fef4e3">无法判断</span>' : `<span class="score ${scoreClass(s)}">${s} / 5</span>`}</td></tr>`;
          }).join('')}</tbody>
        </table></div>
        <div class="note">缺少时间戳、话轮重叠标记或发言时长时，相关维度记「无法判断」，不默认满分。</div>
      </div>
    </div>

    <div class="section-title">信息边界 <span class="sub">破了整个系统就没意义</span></div>
    <div class="card"><div class="table-wrap"><table class="boundary">
      <thead><tr><th style="width:120px">角色</th><th>拿得到</th><th>拿不到</th></tr></thead>
      <tbody>${O.boundary.map(b => `<tr>
        <td style="font-weight:600">${esc(b.who)}</td>
        <td class="can">${esc(b.can)}</td>
        <td class="cannot">${esc(b.cannot)}</td>
      </tr>`).join('')}</tbody>
    </table></div></div>
    <div class="note">观察者看不到人物卡是设计约束，不是遗漏。它一旦看到埋了哪些关键信息，hint 就会直接指向没挖出来的那几条，等于把考题答案递给考生。埋点召回率因此只能由脚本在事后统计。</div>

    <div class="section-title">记录落盘</div>
    <div class="grid two-grid" style="align-items:start">
      <div class="card card-pad">
        <div class="mini-title">规则</div>
        <div class="kv" style="gap:9px 16px">
          <dt>目录</dt><dd class="mono">apps/workbench/records/</dd>
          <dt>格式</dt><dd>JSON + Markdown 各一份</dd>
          <dt>写入</dt><dd>原子写入（临时文件 → rename）</dd>
          <dt>命名</dt><dd>模式-访谈 ID-时间戳</dd>
          <dt>数据单元</dt><dd>round + utterances（不引入 turn）</dd>
        </div>
      </div>
      <div class="card card-pad">
        <div class="mini-title">本场落盘</div>
        <div class="kv" style="gap:9px 16px">
          <dt>ID</dt><dd class="mono" style="font-size:10.5px">${esc(rec.id)}</dd>
          <dt>JSON</dt><dd class="mono" style="font-size:10.5px">records/${esc(rec.id)}.json</dd>
          <dt>Markdown</dt><dd class="mono" style="font-size:10.5px">records/${esc(rec.id)}.md</dd>
          <dt>会话</dt><dd>采访者 / 受访者 / 观察者各持一个 session id，全程不变</dd>
        </div>
      </div>
    </div>`;
}

/* ===================== Router ===================== */
const VIEW_META = {
  overview: ['概览', 'Dashboard'],
  records: ['访谈记录', 'Records'],
  personas: ['人物库', 'Personas'],
  interviewer: ['采访者', 'Interviewer Agent · v' + DATA.interviewer.version],
  observer: ['观察者', 'Observer Agent']
};
const RENDERERS = {
  overview: () => renderOverview(),
  records: () => renderRecords(),
  personas: () => renderPersonas(),
  interviewer: () => renderInterviewer(),
  observer: () => renderObserver()
};

function setView(v) {
  if (!RENDERERS[v]) v = 'overview';
  state.view = v;
  document.querySelectorAll('#nav .nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('active', s.id === 'view-' + v));
  el('topbar-title').textContent = VIEW_META[v][0];
  el('topbar-crumb').textContent = VIEW_META[v][1];
  RENDERERS[v]();
}

function init() {
  el('nav-record-count').textContent = DATA.interviews.length;
  el('nav-persona-count').textContent = DATA.personas.length;
  document.querySelectorAll('#nav .nav-item').forEach(b => {
    b.onclick = () => { if (b.dataset.view === 'records') state.recordId = null; if (b.dataset.view === 'personas') state.personaId = null; setView(b.dataset.view); };
  });
  setView('overview');
}
init();
</script>
</body>
</html>
